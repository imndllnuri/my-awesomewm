# ========================================================
# Modern / stylish picom for AwesomeWM (X11)
# Soft shadows + blur + rounded corners
# ========================================================

backend = "glx";
vsync = true;
use-damage = true;

# --- Shadows (disabled) ---
shadow = false;
shadow-radius = 6;
shadow-offset-x = 0;
shadow-offset-y = 2;
shadow-opacity = 0.25;
shadow-color = "#c0c0c0";

shadow-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Alacritty'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Rounded corners ---
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Blur (needs fork on many distros) ---
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

blur-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Opacity: keep apps solid, but allow terminals to set their own opacity ---
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;

opacity-rule = [
  "75:class_g = 'firefox_firefox'"
];

fading = false;

detect-transient = true;
# detect-rounded-corners = true;

unredir-if-possible = true;
unredir-if-possible-delay = 200;

glx-no-stencil = true;
glx-no-rebind-pixmap = true;
